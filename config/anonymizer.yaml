# Word lists for the anonymizer (src/enps/anonymize/). Matching ignores case and accents.
#
# allowlist   Terms that the NER model and the name gazetteer never mask. Area labels, area codes,
#             tenure labels and the company name from settings.yaml are added automatically.
#             Regex detectors (CPF, phone, plate...) ignore this list. A word that reads as a
#             name once its accents are dropped ("março" and the name Marco) is matched with its
#             accents only, and a capitalized surname right after a first name stays part of the
#             name even when listed here ("Carla Sales").
# name_cues   Words that turn the next first name into a name even in lowercase ("o joao").
#             A name that is also a common word (config/name_stoplist.txt) needs a cue AND a
#             capital letter ("a Clara", never "comunicação clara"). Entries ending in "." also
#             match when written with a period ("Sr. Antunes").
# connectors  Particles allowed inside a full name ("Maria das Graças", "joao da silva").
# nicknames   Short forms missing from the IBGE ranking, treated as first names.
# places      The place gazetteer (src/enps/anonymize/places.py) masks official IBGE place names
#             (data/reference/ibge_*.csv) as LOCAL.
#   cues      Words right before a place name. Each entry joins every word of `first` with every
#             word of `then` ("moro em", "sou de", "filial da"); an entry without `then` is a
#             single word ("em", "bairro"). After a cue a place also matches in lowercase
#             ("moro em pirituba"), unless all its words are common words.
#   stoplist  Place names that usually mean something else: common words, holidays, saints,
#             greetings, dates, brands and football clubs. They match only with a capital letter
#             right after a cue ("moro em Natal"; "o Natal da empresa" is kept).
