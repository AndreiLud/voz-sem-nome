    - first: [moro, mora, moram, moramos, morava, moravam, morei, morou, moraram, morar, morando,
              resido, reside, residem, residia, residente]
      then: [em, no, na, nos, nas]
    - first: [sou, somos, natural, venho, vem, vim, veio, viemos, vindo, vinda, perto, cidade,
              município, filial, unidade, bairro]
      then: [de, do, da, dos, das]
    - first: [transferido, transferida, transferidos, transferidas]
      then: [de, do, da, dos, das, para, pra, pro]
    - first: [em, bairro]
