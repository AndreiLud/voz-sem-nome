# Cloudflare Tunnel, managed from this file. The tunnel only opens an outbound connection:
# no port is opened on the router. Only the public API routes are published; every other
# path, and every other service (n8n, Ollama, internal API), answers 404 or is unreachable.
# The credentials file is created by `cloudflared tunnel create` and stays outside the repo
# (see docs/deploy.md).
tunnel: voz-sem-nome
credentials-file: /etc/cloudflared/credentials.json
no-autoupdate: true

ingress:
  - hostname: voz-sem-nome-api.andreiludescher.com
    # Anchored regex: the five routes of enps.api.public and nothing else.
    path: ^/v1/public/(submissions|submissions/[A-Za-z0-9-]{4,20}|dashboard|status|health)$
    service: http://api:8001
  - service: http_status:404
