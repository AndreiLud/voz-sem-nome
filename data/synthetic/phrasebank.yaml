# Phrase bank for the synthetic survey of the fictitious company "Talvana Distribuição".
#
# Every sentence below was curated for this project. The generator (python -m enps.synth)
# only picks fragments, joins them, fills the {SLOTS} with fake personal data and adds typing
# noise (lower case, missing accents, abbreviations, a few typos). It never invents text.
#
# Regular fragments are grouped by main theme and polarity (pos, neu, neg). An entry is either a
# plain string or a mapping with:
#   t: text                     also: extra theme codes
#   a: areas where it fits      ten: tenure bands where it fits      g: f | m (writer's gender)
#   r: f (formal) | c (casual)  tags: irony | decoy_num | decoy_name   w: weight in the sentiment rule
# The other sections use th (themes) and s (polarity) explicitly.
# Texts start in lower case and have no final period: the generator handles case and punctuation.
# Never copy the example sentences of config/taxonomy.yaml here (a test checks it).
version: 1

fragments:
