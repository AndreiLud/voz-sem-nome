  - {t: "a gente descarrega caminhão num calor de 40 graus, sem ventilador, com empilhadeira quebrada, ganhando pouco, e ainda escuta que precisa vestir a camisa. que camisa?", th: [inf, bem, rem, cul], a: [operacoes]}
