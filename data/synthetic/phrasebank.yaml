  - {t: "sinceramente não aguento mais, a meta sobe todo mês, o salário é o mesmo faz dois anos, o supervisor só cobra e quando a gente pede ajuda ele manda se virar, ninguém fica assim muito tempo", th: [car, rem, lid], ten: [y1to3, y3to5, gt5]}
