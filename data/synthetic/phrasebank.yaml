# Openers and closers carry no theme. n: any style, f: formal, c: casual.
glue:
  openers:
    n: ["olha, ", "bom, ", "sinceramente, ", "então, ", "falando com sinceridade, ", "resumindo: ", "na real, ", "é o seguinte: "]
    f: ["prezados, ", "bom dia. ", "agradeço o espaço. ", "em primeiro lugar, agradeço pela pesquisa. "]
    c: ["mano, ", "pô, ", "tipo assim, ", "sei lá, ", "na boa, "]
  closers:
    n: ["é isso", "só isso", "é o que eu penso", "espero que leiam"]
    f: ["atenciosamente", "agradeço a atenção", "fico à disposição"]
    c: ["valeu", "fica a dica", "tmj", "é nóis"]

noise:
  # Replacements used by the casual and informal styles. Keys are matched as whole words.
  abbreviations:
    "você": [vc]
    "vocês": [vcs]
    "também": [tb, tbm]
    "porque": [pq]
    "que": [q]
    "muito": [mt, mto]
    "muita": [mta]
    "tudo": [td]
    "ninguém": [ngm]
    "hoje": [hj]
    "mesmo": [msm]
    "beleza": [blz]
    "não": [n, ñ]
    "para": [pra]
    "está": [tá, ta]
    "estou": [tô, to]
    "quando": [qnd, qdo]
    "comigo": [cmg]
    "depois": [dps]
    "quem": [qm]
    "fim de semana": [fds]
    "de novo": [dnv]
    "por favor": [pfv]
  # The only replacements of the "standard" style, where people mostly write in full.
  light: ["para", "está", "estou"]
  # Contractions that already appear in the fragments and count as abbreviations.
  contractions: [pro, pros, pras, tá, tô]
  slang: [puxado, puxada, correria, b.o., zoado, zoada, top, mó, tipo assim, sei lá, mano, pô, galera, resenha, bonzão, só o pó, bagaço, saco cheio, tmj, é nóis, gente fina, gente boa, vácuo, fraquinha, raiz, gambiarra, rala, curto muito, sem neura]
  laughter: [kkk, kkkk, kkkkk, rsrs, hahaha]
  # Obvious words for critical topics, compared without accents as prefixes. A critical template
  # marked subtle must contain none of them.
  explicit_keywords: [assedi, burnout, discrimin, racis, ameac, violen, agred, agress, homofob, machis, suicid, depress, panico, abus, estupr, bullying]

