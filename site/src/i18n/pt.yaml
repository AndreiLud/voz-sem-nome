privacy:
  title: "Privacidade"
  toc_title: "Nesta página"
  lead: "Esta página explica o que a demonstração pública coleta e como trata cada dado. O projeto é de portfólio e usa uma empresa fictícia."
  updated: "Vale para a versão atual da demonstração."
  sections:
    collect:
      title: "O que a demonstração coleta"
      items:
        - "A nota de 0 a 10, a área e o tempo de casa que você escolhe."
        - "O comentário, se você escrever um. Ele é anonimizado antes de ser gravado."
        - "O idioma da página e a data e hora do envio."
        - "O resultado da verificação contra robôs (Cloudflare Turnstile). O token é conferido e descartado."
    anonymize:
      title: "O que é anonimizado e como"
      text: "Antes de gravar, o sistema procura dados pessoais no comentário e troca cada um por um marcador. Regras fixas acham documentos e contatos pelos padrões e dígitos verificadores. Uma lista de nomes do IBGE e um modelo pequeno de reconhecimento de nomes acham pessoas e lugares. Só o texto com marcadores segue para o modelo de linguagem."
      table_caption: "Marcadores usados no lugar de dados pessoais"
      col_marker: "Marcador"
      col_meaning: "O que substitui"
      limits: "Nenhum método acerta sempre. Por isso pedimos que você não escreva dados reais. Nos trechos públicos do painel, palavrões também viram marcador."
    never:
      title: "O que nunca é gravado"
      items:
        - "O texto original do comentário."
        - "O endereço IP. Ele fica só em memória, para limitar envios em excesso e contar pessoas diferentes por dia com um código que muda todo dia."
        - "Cookies de rastreamento ou ferramentas de análise de audiência. O site não usa nenhum."
    retention:
      title: "Por quanto tempo"
      items:
        - "Envios públicos: apagados depois de {days} dias."
        - "Registro de alertas: só identificador, tipos de caso e horários, apagados depois de {alert_days} dias."
        - "Contadores diários sem texto, como número de envios e tempo de análise: mantidos para as estatísticas de produção."
    min_group:
      title: "Grupo mínimo"
      text: "Nenhum grupo, cruzamento ou recorte com menos de {k} respostas aparece no painel. Áreas pequenas entram juntas num grupo sem nome. Quando esse grupo também fica pequeno, a menor área visível entra nele, para que ninguém descubra um grupo escondido subtraindo os outros do total."
    who:
      title: "Quem vê o quê"
      table_caption: "Acesso aos dados da demonstração"
      col_who: "Quem"
      col_what: "O que vê"
      rows:
        - who: "Qualquer pessoa no site"
          what: "Números agregados com grupo mínimo e trechos anonimizados de casos críticos, sem tempo de casa e com área só quando o grupo é grande o bastante."
        - who: "Quem enviou a resposta"
          what: "O próprio resultado, com o código de acompanhamento."
        - who: "Responsável pelo projeto"
          what: "Os alertas, com o texto anonimizado, que podem ir para o Telegram, e o banco, que guarda só texto anonimizado."
        - who: "Cloudflare"
          what: "Dados de conexão para entregar o site, rodar a verificação contra robôs e bloquear abuso, conforme a política da própria Cloudflare."
    legal:
      title: "Base legal sugerida para uma empresa real"
      text: "Nesta demonstração, a base é o seu consentimento, dado na caixa de confirmação do formulário. Numa empresa real, a base mais comum para pesquisa de clima é o legítimo interesse (art. 7º, IX, da LGPD), com teste de balanceamento documentado e direito de não responder. Comentários podem trazer dados sensíveis, como saúde ou orientação sexual, que pedem uma base do art. 11. Quando a pesquisa apoia a gestão de riscos psicossociais da NR-1, o cumprimento de obrigação legal pode ser considerado."
      disclaimer: "Este é um projeto de portfólio e não é orientação jurídica. Uma empresa real deve validar a base legal com o encarregado de dados e o jurídico."
    rights:
      title: "Dúvidas"
      text: "Os envios são anônimos, então não há como achar o seu sem o código de acompanhamento. Para dúvidas sobre o projeto, use o contato em [andreiludescher.com](https://andreiludescher.com)."

