privacy:
  title: "Privacidade"
  toc_title: "Nesta página"
  lead: "Esta página explica o que a demonstração pública coleta, onde cada dado é tratado e por quanto tempo fica guardado. O projeto é de portfólio e usa uma empresa fictícia."
  updated: "Vale para a versão atual da demonstração, que roda na Cloudflare."
  sections:
    collect:
      title: "O que a demonstração coleta"
      items:
        - "A nota de 0 a 10, a área e o tempo de casa que você escolhe."
        - "O comentário, se você escrever um. Ele é anonimizado antes de ser gravado e antes de chegar ao modelo."
        - "O idioma da página e a data e hora do envio."
        - "O resultado da verificação contra robôs. Para fazer essa verificação, o Cloudflare Turnstile trata o seu endereço IP, a assinatura TLS da conexão e a identificação do navegador (user agent). O token é conferido e descartado. Detalhes na [política de privacidade do Turnstile](https://www.cloudflare.com/turnstile-privacy-policy/)."
    where:
      title: "Onde os dados são tratados"
      text: "A demonstração roda inteira na Cloudflare. Nenhuma parte roda num servidor caseiro."
      items:
        - "**Worker**: o código que recebe a resposta, anonimiza o comentário e grava o resultado."
        - "**Workers AI**: o serviço da Cloudflare que roda o modelo {edge_model} e classifica o texto anonimizado."
        - "**D1**: o banco de dados da Cloudflare, onde ficam o texto anonimizado, a nota, a área, o tempo de casa e a classificação."
        - "**Turnstile**: a verificação contra robôs."
      abroad: "O processamento e o armazenamento acontecem fora do Brasil. A Cloudflare lista como suboperadores do Workers AI empresas nos Estados Unidos e na Inglaterra ([lista de suboperadores](https://www.cloudflare.com/gdpr/subprocessors/cloudflare-services/)), e o D1 não oferece localização no Brasil nem na América do Sul ([localização do D1](https://developers.cloudflare.com/d1/configuration/data-location/)). Isso é uma transferência internacional de dados, e por isso o formulário avisa antes do envio."
    roles:
      title: "Controlador e operador"
      text: "O responsável pelo projeto, Andrei Ludescher, é o controlador: decide o que é coletado e para quê. A Cloudflare é a operadora: trata os dados em nome do controlador. O [acordo de tratamento de dados da Cloudflare](https://www.cloudflare.com/cloudflare-customer-dpa/) diz isso com estas palavras: “the Customer is the Controller” e “Cloudflare is a Processor”. O acordo não cita a LGPD. A Cloudflare explica como vê a lei na [página sobre a LGPD](https://www.cloudflare.com/trust-hub/brazil-lgpd/). Há uma exceção no Turnstile: a Cloudflare também usa os sinais da verificação para melhorar a própria detecção de robôs e, nesse uso, se declara controladora ([política de privacidade do Turnstile](https://www.cloudflare.com/turnstile-privacy-policy/))."
    anonymize:
      title: "O que é anonimizado e como"
      text: "O comentário é anonimizado dentro do Worker, antes de ser gravado e antes de chegar ao modelo. Regras fixas acham documentos, contatos e endereços pelos padrões e dígitos verificadores. Uma lista de nomes do IBGE acha nomes de pessoas. A demonstração não usa um modelo de reconhecimento de nomes, então nomes de lugares escapam com mais facilidade que no modo local. Só o texto com marcadores chega ao Workers AI."
      table_caption: "Marcadores usados no lugar de dados pessoais"
      col_marker: "Marcador"
      col_meaning: "O que substitui"
      limits: "Nenhum método acerta sempre. Por isso pedimos que você não escreva dados reais. Nos trechos públicos do painel, palavrões também viram marcador."
    model:
      title: "O que a Cloudflare faz com o texto"
      items:
        - "A Cloudflare afirma que não usa o conteúdo processado pelo Workers AI para treinar modelos: “Cloudflare does not use Customer Content processed by Workers AI to train AI models” ([uso de dados no Workers AI](https://developers.cloudflare.com/workers-ai/platform/data-usage/))."
        - "Nas requisições comuns de inferência, como as desta demo, ela afirma que não guarda entradas nem saídas depois de entregar a resposta: “does not retain inputs or outputs after they are no longer needed to process the request” (mesma página). A mesma página lista exceções, como uma obrigação legal."
        - "Ela pode guardar metadados técnicos, como horário, modelo usado e número de tokens, sem o conteúdo."
        - "O Worker não escreve o texto dos comentários nos logs."
    never:
      title: "O que nunca é gravado"
      items:
        - "O texto original do comentário."
        - "O endereço IP. Ele serve de chave para o limitador de envios da Cloudflare, que só mantém contadores de curta duração, e nunca é gravado no banco. Para contar pessoas diferentes por dia, o Worker grava um código (hash) do IP misturado com um valor que muda todo dia. Esses códigos são apagados no dia seguinte."
        - "Cookies de rastreamento ou ferramentas de análise de audiência. O site não usa nenhum."
    retention:
      title: "Por quanto tempo"
      items:
        - "Envios públicos: apagados depois de {days} dias por uma rotina diária do Worker."
        - "Registro de alertas: só identificador, tipos de caso e horários, apagados depois de {alert_days} dias."
        - "Códigos diários usados para contar pessoas diferentes: apagados no dia seguinte."
        - "Linhas apagadas do D1 ainda podem ser restauradas por 7 dias pelo Time Travel, um recurso do banco que fica sempre ligado ([Time Travel do D1](https://developers.cloudflare.com/d1/reference/time-travel/)). Na prática, um envio some de vez em até {gone_days} dias."
        - "Registros técnicos das chamadas à API (Workers Logs), sem o texto dos comentários: a Cloudflare guarda por 3 dias ([Workers Logs](https://developers.cloudflare.com/workers/observability/logs/workers-logs/))."
        - "Contadores diários sem texto, como número de envios e tempo de análise: mantidos para as estatísticas da demo."
    min_group:
      title: "Grupo mínimo"
      text: "Nenhum grupo, cruzamento ou recorte com menos de {k} respostas aparece no painel. Áreas pequenas entram juntas num grupo sem nome. Quando esse grupo também fica pequeno, a menor área visível entra nele, para que ninguém descubra um grupo escondido subtraindo os outros do total."
    who:
      title: "Quem vê o quê"
      table_caption: "Acesso aos dados da demonstração"
      col_who: "Quem"
      col_what: "O que vê"
      rows:
        - who: "Qualquer pessoa no site"
          what: "Números agregados com grupo mínimo e trechos anonimizados de casos críticos, sem tempo de casa e com área só quando o grupo é grande o bastante."
        - who: "Quem enviou a resposta"
          what: "O próprio resultado, com o código de acompanhamento."
        - who: "Responsável pelo projeto (controlador)"
          what: "O banco D1, que guarda só texto anonimizado, e os alertas de casos críticos."
        - who: "Cloudflare (operadora)"
          what: "Roda o Worker, o modelo no Workers AI, o banco D1 e o Turnstile. Recebe dados de conexão para entregar o site e bloquear abuso, e o texto já anonimizado para a classificação."
        - who: "n8n, se configurado"
          what: "Recebe por webhook os alertas de casos críticos, com o trecho anonimizado. Sem o webhook, nada vai para o n8n."
    local:
      title: "Modo local"
      text: "Para organizações que não podem deixar nada sair da própria infraestrutura, o mesmo sistema roda com docker compose num servidor da empresa: anonimização com regras, lista do IBGE e reconhecimento de nomes do spaCy, classificação com o {local_model} no Ollama, banco SQLite e automações no n8n. Nesse modo, nenhum comentário vai para a Cloudflare nem para outro serviço, a não ser canais de aviso que a própria empresa ligar, como o Telegram."
    legal:
      title: "Base legal sugerida para uma empresa real"
      text: "Nesta demonstração, a base é o seu consentimento, dado na caixa de confirmação do formulário, que também avisa que a análise acontece fora do Brasil. Numa empresa real, a base mais comum para pesquisa de clima é o legítimo interesse (art. 7º, IX, da LGPD), com teste de balanceamento documentado e direito de não responder. Comentários podem trazer dados sensíveis, como saúde ou orientação sexual, que pedem uma base do art. 11. Quando a pesquisa apoia a gestão de riscos psicossociais da NR-1, o cumprimento de obrigação legal pode ser considerado. Uma empresa que use a Cloudflare, como esta demo, também precisa tratar a transferência internacional (art. 33 da LGPD). O modo local evita essa transferência."
      disclaimer: "Este é um projeto de portfólio e não é orientação jurídica. Uma empresa real deve validar a base legal com o encarregado de dados e o jurídico."
    rights:
      title: "Dúvidas"
      text: "Os envios são anônimos, então não há como achar o seu sem o código de acompanhamento. Para dúvidas sobre o projeto, use o contato em [andreiludescher.com](https://andreiludescher.com)."

