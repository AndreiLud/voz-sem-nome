# Labels of the placeholders written by the anonymizer.
placeholders:
  PESSOA: "nome de pessoa"
  LOCAL: "lugar"
  EMAIL: "e-mail"
  TELEFONE: "telefone"
  CPF: "CPF"
  CNPJ: "CNPJ"
  RG: "RG"
  CEP: "CEP"
  MATRICULA: "matrícula"
  PLACA: "placa de veículo"
  DOCUMENTO: "outro documento"
  ofensivo: "palavrão, nos trechos públicos"

home:
  hero:
    eyebrow: "Projeto de portfólio"
    title: "Pesquisa de clima e eNPS com IA, sem expor ninguém"
    lead: "O Voz sem nome tira nomes, documentos e contatos dos comentários antes de qualquer modelo ler o texto. Depois, um modelo de linguagem separa os temas, mede o sentimento e sinaliza casos que pedem atenção do RH, como assédio e burnout. A demo roda na Cloudflare. O mesmo sistema também roda inteiro no servidor da própria empresa."
    cta_primary: "Testar a demo"
    cta_secondary: "Ver o painel"
    example_title: "Um comentário depois de passar pelo sistema"
    example_comment: "Desde que [PESSOA] virou coordenador em [LOCAL], ele grita com a equipe na frente de todo mundo. Já pedi ajuda no RH e nada mudou."
    example_translation: ""
    example_removed: "Removido: 1 nome de pessoa e 1 lugar"
    example_theme_label: "Tema"
    example_theme: "Liderança"
    example_sentiment_label: "Sentimento"
    example_sentiment: "Negativo"
    example_critical_label: "Caso crítico"
    example_critical: "Assédio moral"

  problem:
    title: "O problema"
    lead: "Numa pesquisa de clima, a nota diz pouco. O motivo está nos comentários abertos, e alguém precisa ler um por um."
    items:
      - title: "Leitura manual"
        text: "Ler, separar por tema e contar comentários toma dias do time de RH a cada ciclo. Com centenas de respostas, a análise chega tarde."
      - title: "Risco de privacidade"
        text: "Comentários citam colegas, gestores, filiais e às vezes telefone ou e-mail. Quem lê descobre de quem se fala, e um recorte pequeno pode revelar quem respondeu."
      - title: "Sinais graves se perdem"
        text: "Um relato de assédio ou de esgotamento pode ficar no meio das outras respostas até o relatório final."
    nr1_label: "Contexto"
    nr1: "Desde 26/05/2026, a NR-1 inclui os fatores de risco psicossociais no gerenciamento de riscos ocupacionais das empresas. Uma pesquisa de clima não cumpre essa exigência sozinha, mas os comentários costumam mostrar esses riscos cedo. Isto é contexto, não orientação jurídica."
    nr1_link: "Ver a NR-1 no site do Ministério do Trabalho e Emprego"
    nr1_url: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadora/normas-regulamentadoras-vigentes/nr-1"

  solution:
    title: "A solução"
    lead: "Um fluxo que trata cada comentário como dado sensível, do envio ao painel."
    items:
      - title: "Anonimização antes de tudo"
        text: "Regras e uma lista de nomes do IBGE trocam dados pessoais por marcadores como PESSOA e CPF. No modo local, um modelo pequeno de reconhecimento de nomes reforça a busca. O texto original não é gravado."
      - title: "Duas formas de rodar"
        text: "A demo roda na Cloudflare: o Workers AI classifica com o {edge_model} e só recebe texto anonimizado. Quem não pode deixar nada sair de casa usa o modo local, com o {local_model} no Ollama, na CPU do próprio servidor."
      - title: "Painel com grupo mínimo"
        text: "Nenhum grupo com menos de {k} respostas aparece. Áreas pequenas são somadas para que ninguém seja identificado por subtração."
      - title: "Alerta de caso crítico"
        text: "Quando o modelo ou o léxico de risco aponta assédio, discriminação, burnout ou ameaça, o sistema registra um alerta só com o texto anonimizado. No modo local, o n8n avisa o responsável pelo Telegram e manda um resumo diário. Na demo, o Worker pode repassar o caso para um webhook do n8n."

  how:
    title: "Como funciona"
    lead: "A demo ao vivo roda inteira na Cloudflare, sem servidor próprio. Cada resposta passa por regras fixas e por um modelo de linguagem. A legenda mostra o tipo de cada peça. O reconhecimento de nomes só existe no modo local, e o n8n entra depois do alerta."
    figure_title: "Caminho de uma resposta na demo, do envio ao painel e ao alerta"
    figure_caption: "As cores e as etiquetas indicam o tipo de cada peça. O ramo do modo local só existe quando o sistema roda num servidor próprio. A mesma informação aparece em texto na lista numerada."
    text_title: "O diagrama em texto"
    legend_title: "Legenda"
    kinds:
      rule: {tag: "REGRA", name: "Regra fixa", text: "padrões, listas e dígitos verificadores. Sempre dá o mesmo resultado."}
      ner: {tag: "NER", name: "Modelo pequeno", text: "reconhecimento de nomes de pessoas e lugares com spaCy. Só no modo local."}
      llm: {tag: "LLM", name: "Modelo de linguagem", text: "lê o texto anonimizado e devolve rótulos num formato fixo. Na demo, o {edge_model} no Workers AI. No modo local, o {local_model} no Ollama."}
      n8n: {tag: "N8N", name: "Automação", text: "fluxos do n8n. No modo local, eles mandam os alertas, um resumo diário e apagam envios antigos. Na demo, o n8n só recebe casos críticos por webhook, se estiver configurado."}
    branch_edge: "demo"
    branch_local: "modo local"
    branch_all: "todas"
    branch_critical: "se crítico"
    divider: "Daqui em diante, só texto anonimizado"
    steps:
      input:
        title: "Resposta"
        lines: ["Nota de 0 a 10, área, tempo de casa", "e um comentário opcional"]
        text: "A resposta chega ao Worker da Cloudflare com nota de 0 a 10, área, tempo de casa e um comentário opcional. Antes, o Turnstile confere se quem envia não é um robô."
      rules:
        title: "Regras no Worker"
        lines: ["CPF, CNPJ, RG, CEP, e-mail, telefone, placa,", "matrícula, endereço e nomes do IBGE"]
        text: "Dentro do Worker, padrões e dígitos verificadores acham CPF, CNPJ, RG, CEP, e-mail, telefone, placa, matrícula e endereço. Uma lista de nomes do IBGE acha nomes de pessoas. Cada achado vira um marcador como PESSOA, e o texto original é descartado aqui."
      ner:
        title: "Nomes e lugares"
        lines: ["Modelo pequeno do spaCy acha o", "que as regras não cobrem"]
        text: "Só no modo local. Um modelo pequeno do spaCy acha nomes de pessoas e lugares que as regras não cobrem. Na demo não há esse passo, por isso nomes de lugares escapam com mais facilidade."
      lexicon:
        title: "Léxico de risco"
        lines: ["Frases explícitas de assédio, violência", "ou autolesão marcam o caso na hora"]
        text: "Frases explícitas de assédio, violência ou autolesão marcam o caso como crítico, mesmo que o modelo falhe. A marca só cai quando as duas leituras do modelo dizem que não é caso crítico."
      llm:
        title: "Workers AI"
        lines: ["{edge_model} devolve temas,", "sentimento e um primeiro sinal crítico"]
        text: "O Worker manda só o texto anonimizado ao Workers AI, onde o {edge_model} (`{edge_model_id}`) devolve temas, sentimento e um primeiro sinal de caso crítico. No modo local, o mesmo prompt roda no {local_model} com Ollama, na CPU do servidor."
      verifier:
        title: "Segunda leitura"
        lines: ["Quando há sinal de risco, o modelo relê.", "Na dúvida, o caso fica marcado."]
        text: "Quando há qualquer sinal de risco, o modelo relê o comentário com foco em casos críticos. Na dúvida, o caso fica marcado."
      storage:
        title: "Banco D1"
        lines: ["Guarda só o texto anonimizado,", "os rótulos e os tempos"]
        text: "O resultado fica no D1, o banco de dados da Cloudflare: texto anonimizado, rótulos e tempos. Envios públicos são apagados depois de {days} dias. No modo local, o banco é um SQLite no próprio servidor."
      dashboard:
        title: "Painel"
        lines: ["Grupos com {k} ou", "mais respostas"]
        text: "O painel mostra só grupos com {k} ou mais respostas."
      alert:
        title: "Alerta"
        lines: ["Fica registrado e", "pode ir ao n8n"]
        text: "Um caso crítico vira um alerta registrado no D1, só com o texto anonimizado. Se houver um webhook do n8n configurado, o Worker repassa o alerta para ele."
    local_title: "Modo local"
    local_items:
      - "Roda com docker compose no servidor da própria organização. Nenhum comentário sai da infraestrutura dela."
      - "Anonimiza com as mesmas regras e a lista do IBGE, mais o reconhecimento de nomes do spaCy."
      - "Classifica com o {local_model} no Ollama, na CPU do servidor, sem GPU."
      - "O n8n manda os alertas pelo Telegram, faz um resumo diário e apaga envios antigos."
      - "A análise publicada da base sintética e a medição de tempo na CPU vêm deste modo."

  results:
    title: "Resultados"
    lead: "Números medidos na base sintética, que tem rótulos conhecidos. Os quadros mostram a demo ao vivo, que roda na Cloudflare. A tabela compara a demo com o modo local."
    sample_note: "Estes números são de exemplo. Os resultados medidos aparecem aqui depois da avaliação."
    live_title: "Demo ao vivo (Cloudflare)"
    items:
      pii_recall:
        label: "Dados pessoais encontrados"
        method: "Parcela dos dados pessoais plantados na base sintética que o Worker trocou por marcadores, só com regras e a lista de nomes."
        n: "{n} dados pessoais"
      pii_leaks:
        label: "Comentários com vazamento"
        method: "Comentários em que sobrou pelo menos um dado pessoal plantado, entre os que tinham algum."
        n: "{n} comentários"
      critical_recall:
        label: "Casos críticos encontrados"
        method: "Casos críticos do conjunto de teste que o sistema marcou. É o número que mais importa: um caso perdido custa mais que um alarme falso."
        n: "{n} casos críticos"
      critical_precision:
        label: "Alertas corretos"
        method: "Entre os comentários marcados como críticos, a parcela que de fato era crítica."
        n: "{n} alertas"
      sentiment:
        label: "Sentimento correto"
        method: "Comentários do conjunto de teste em que o sentimento bateu com os rótulos."
        n: "{n} comentários"
        extra: "Kappa de Cohen: {value}"
      themes:
        label: "Temas, F1 macro"
        method: "Média do F1 de cada tema. Temas raros pesam o mesmo que temas comuns."
        n: "{n} comentários"
      latency:
        label: "Tempo por comentário"
        method: "Mediana do tempo de classificação no Workers AI, medida pelo Worker em cada comentário."
        n: "{n} comentários"
        extra: "p95: {value}"
    ci: "IC 95%: {lo} a {hi}"
    compare:
      title: "Demo (Cloudflare) vs modo local (servidor próprio)"
      lead: "Os mesmos comentários da base sintética, medidos nos dois caminhos. O tempo do modo local é medido na CPU do servidor, sem GPU, depois do modelo carregado."
      col_metric: "Medida"
      col_edge: "Demo (Cloudflare)"
      col_local: "Modo local (servidor próprio)"
      n: "(n = {n})"
      rows:
        anonymizer: {label: "Anonimização", edge: "Regras e lista de nomes do IBGE, no Worker", local: "Regras, lista do IBGE e NER do spaCy"}
        model: {label: "Modelo", edge: "{edge_model} no Workers AI", local: "{local_model} no Ollama, na CPU"}
    reference:
      intended: "Referência: rótulos definidos na geração da base sintética."
      human: "Referência: rótulos de uma pessoa que leu os comentários sem ver a resposta do modelo."
    hardware: "Servidor do modo local com {cpus} vCPUs e {mem} GiB de RAM."
    pipeline:
      edge: "Demo: {parts}."
      local: "Modo local: {parts}."
    pipeline_parts:
      model: "modelo {value}"
      prompt: "prompt {value}"
      anonymizer: "anonimizador {value}"

  estimate:
    title: "Horas economizadas"
    lead: "Uma conta simples para a sua realidade. Mude os valores da tabela e o resultado muda na hora."
    note: "Os valores padrão são suposições de exemplo, não medições. O tempo de máquina vem das medições acima: o da demo quando existe, senão o do modo local."
    table_caption: "Suposições da estimativa"
    col_assumption: "Suposição"
    col_value: "Valor"
    rows:
      responses_per_cycle: {label: "Respostas por ciclo", unit: "respostas"}
      comment_share: {label: "Parcela com comentário", unit: "%"}
      minutes_read_classify: {label: "Minutos para ler e classificar um comentário", unit: "min"}
      minutes_anonymize: {label: "Minutos para anonimizar um comentário à mão", unit: "min"}
      cycles_per_year: {label: "Ciclos de pesquisa por ano", unit: "ciclos"}
      review_share: {label: "Parcela que ainda precisa de revisão humana", unit: "%"}
      minutes_per_review: {label: "Minutos por revisão", unit: "min"}
    outputs_title: "Resultado da estimativa"
    outputs:
      comments: "Comentários por ano"
      manual: "Horas de trabalho manual por ano"
      review: "Horas de revisão com o sistema"
      saved: "Horas economizadas por ano"
      machine: "Tempo de máquina por ano"
    machine_not_measured: "Ainda não medido"
    machine_source:
      edge: "O tempo de máquina usa a média medida no Workers AI."
      local: "O tempo de máquina usa a média medida na CPU do modo local."
    hours: "{value} h"
    formula_title: "Como a conta é feita"
    formula:
      - "Comentários por ano = respostas × parcela com comentário × ciclos."
      - "Trabalho manual = comentários × (minutos de leitura + minutos de anonimização) ÷ 60."
      - "Revisão com o sistema = comentários × parcela revisada × minutos por revisão ÷ 60."
      - "Horas economizadas = trabalho manual menos revisão. O tempo de máquina usa a média medida por comentário e não conta como trabalho de pessoas."
    reset: "Voltar aos valores padrão"
    invalid: "Use um número entre {min} e {max}."

  preview:
    title: "O painel"
    lead: "O painel mostra eNPS, temas, sentimento e casos críticos sem expor grupos pequenos."
    enps_label: "eNPS da base sintética"
    responses: "{n} respostas"
    promoters: "Promotores"
    passives: "Neutros"
    detractors: "Detratores"
    bar_label: "Distribuição das respostas"
    explainer: "eNPS é a porcentagem de promotores (notas 9 e 10) menos a de detratores (0 a 6). Vai de −100 a +100."
    empty: "A base sintética ainda não tem respostas suficientes para mostrar números."
    link: "Ver o painel completo"

  privacy_summary:
    title: "Privacidade"
    lead: "A demonstração foi desenhada para guardar o mínimo."
    items:
      - "O comentário é anonimizado dentro do Worker da Cloudflare, antes de chegar ao modelo. O texto original não é gravado."
      - "A Cloudflare diz que não usa esse conteúdo para treinar modelos e que não guarda o que passa pelo modelo depois da resposta."
      - "O processamento e o banco de dados ficam fora do Brasil, na Cloudflare."
      - "O endereço IP nunca é gravado no banco de dados. Só um código diário, apagado no dia seguinte, para contar pessoas diferentes."
      - "Envios públicos são apagados depois de {days} dias, e grupos com menos de {k} respostas não aparecem no painel."
    link: "Ler a página de privacidade"

  demo:
    title: "Teste com uma resposta fictícia"
    text: "Escreva como se trabalhasse na Talvana Distribuição, uma empresa inventada. Você recebe um código para acompanhar o resultado da análise."
    cta: "Enviar uma resposta"

