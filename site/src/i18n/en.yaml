privacy:
  title: "Privacy"
  toc_title: "On this page"
  lead: "This page explains what the public demo collects, where each item is processed and how long it is kept. It is a portfolio project and uses a fictitious company."
  updated: "Applies to the current version of the demo, which runs on Cloudflare."
  sections:
    collect:
      title: "What the demo collects"
      items:
        - "The score from 0 to 10, the area and the tenure you pick."
        - "The comment, if you write one. It is anonymized before it is stored and before it reaches the model."
        - "The page language and the date and time of the submission."
        - "The result of the bot check. To run that check, Cloudflare Turnstile processes your IP address, the TLS fingerprint of the connection and your browser's user agent. The token is verified and dropped. Details in the [Turnstile privacy policy](https://www.cloudflare.com/turnstile-privacy-policy/)."
    where:
      title: "Where the data is processed"
      text: "The demo runs entirely on Cloudflare. No part of it runs on a home server."
      items:
        - "**Worker**: the code that receives the answer, anonymizes the comment and stores the result."
        - "**Workers AI**: the Cloudflare service that runs the {edge_model} model and classifies the anonymized text."
        - "**D1**: Cloudflare's database, which holds the anonymized text, the score, area, tenure and the classification."
        - "**Turnstile**: the bot check."
        - "**Web Analytics**: page visit counts, without cookies."
      abroad: "Processing and storage happen outside Brazil. Cloudflare lists companies in the United States and England as sub-processors for Workers AI ([sub-processor list](https://www.cloudflare.com/gdpr/subprocessors/cloudflare-services/)), and D1 offers no location in Brazil or South America ([D1 data location](https://developers.cloudflare.com/d1/configuration/data-location/)). This is an international data transfer, which is why the form says so before you submit."
    roles:
      title: "Controller and processor"
      text: "The person in charge of the project, Andrei Ludescher, is the controller (controlador under the LGPD): he decides what is collected and why. Cloudflare is the processor (operador): it processes the data on the controller's behalf. The [Cloudflare data processing addendum](https://www.cloudflare.com/cloudflare-customer-dpa/) puts it in these words: “the Customer is the Controller” and “Cloudflare is a Processor”. The addendum does not mention the LGPD. Cloudflare explains its view of the law on its [LGPD page](https://www.cloudflare.com/trust-hub/brazil-lgpd/). Turnstile is an exception: Cloudflare also uses the bot check signals to improve its own bot detection, and for that use it states that it is a controller ([Turnstile privacy policy](https://www.cloudflare.com/turnstile-privacy-policy/))."
    anonymize:
      title: "What is anonymized and how"
      text: "The comment is anonymized inside the Worker, before it is stored and before it reaches the model. Fixed rules find documents, contact details and addresses by their patterns and check digits. Official lists from IBGE, the Brazilian statistics office, find first names, surnames, municipalities and districts. The demo does not use the name recognition model of local mode, so a name or place missing from the lists can pass through. Only the text with placeholders reaches Workers AI."
      table_caption: "Placeholders used instead of personal data"
      col_marker: "Placeholder"
      col_meaning: "What it replaces"
      limits: "No method is always right. That is why we ask you not to write real data. In public excerpts on the dashboard, swear words also become a placeholder."
    model:
      title: "What Cloudflare does with the text"
      items:
        - "Cloudflare states that it does not use content processed by Workers AI to train models: “Cloudflare does not use Customer Content processed by Workers AI to train AI models” ([Workers AI data usage](https://developers.cloudflare.com/workers-ai/platform/data-usage/))."
        - "For standard inference requests, like the ones in this demo, it states that it does not keep inputs or outputs after delivering the response: “does not retain inputs or outputs after they are no longer needed to process the request” (same page). The same page lists exceptions, such as a legal obligation."
        - "It may keep technical metadata, such as timestamps, the model used and token counts, without the content."
        - "The Worker never writes comment text to its logs."
    never:
      title: "What is never stored"
      items:
        - "The original comment text."
        - "Your IP address. It is the key of Cloudflare's submission rate limiter, which keeps only short lived counters, and it is never written to the database. To count distinct people per day, the Worker stores a code (hash) of the IP mixed with a value that changes every day. These codes are deleted the next day."
        - "Tracking cookies. The site uses none. To count visits it uses Cloudflare Web Analytics, which stores no cookies and nothing else in the browser and, according to Cloudflare, “does not collect or use your visitors’ personal data” ([Web Analytics](https://developers.cloudflare.com/web-analytics/about/))."
    retention:
      title: "How long data is kept"
      items:
        - "Public submissions: deleted after {days} days by a daily job of the Worker."
        - "Alert log: only an identifier, the case types and timestamps, deleted after {alert_days} days."
        - "Daily codes used to count distinct people: deleted the next day."
        - "Rows deleted from D1 can still be restored for 7 days through Time Travel, a database feature that is always on ([D1 Time Travel](https://developers.cloudflare.com/d1/reference/time-travel/)). In practice, a submission is gone for good within {gone_days} days."
        - "Technical records of the API calls (Workers Logs), without comment text: Cloudflare keeps them for 3 days ([Workers Logs](https://developers.cloudflare.com/workers/observability/logs/workers-logs/))."
        - "Daily counters without any text, such as number of submissions and analysis time: kept for the demo statistics."
    min_group:
      title: "Minimum group"
      text: "No group, cross tab or slice with fewer than {k} answers is shown on the dashboard. Small areas are merged into one unnamed group. When that group is small too, the smallest visible area joins it, so nobody can find a hidden group by subtracting the others from the total."
    who:
      title: "Who sees what"
      table_caption: "Access to the demo data"
      col_who: "Who"
      col_what: "What they see"
      rows:
        - who: "Anyone on the site"
          what: "Aggregated numbers with a minimum group and anonymized excerpts of critical cases, without tenure and with the area only when the group is large enough."
        - who: "The person who submitted"
          what: "Their own result, with the tracking code."
        - who: "Person in charge of the project (controller)"
          what: "The D1 database, which keeps anonymized text only, and the critical case alerts."
        - who: "Cloudflare (processor)"
          what: "Runs the Worker, the model on Workers AI, the D1 database and Turnstile. Receives connection data to deliver the site and block abuse, and the already anonymized text for the classification."
        - who: "n8n, when set up"
          what: "Receives critical case alerts through a webhook, with the anonymized excerpt. Without the webhook, nothing goes to n8n."
    local:
      title: "Local mode"
      text: "For organizations that cannot let anything leave their own infrastructure, the same system runs with docker compose on a company server: anonymization with rules, the IBGE list and spaCy name recognition, classification with {local_model} on Ollama, an SQLite database and n8n automations. In this mode, no comment goes to Cloudflare or any other service, except alert channels the company itself turns on, such as Telegram."
    legal:
      title: "Suggested legal basis for a real company"
      text: "In this demo, the basis is your consent, given with the confirmation box on the form, which also says that the analysis happens outside Brazil. In a real company in Brazil, the most common basis for a climate survey is legitimate interest (LGPD, art. 7, IX), with a documented balancing test and the right not to answer. Comments may contain sensitive data, such as health or sexual orientation, which needs a basis from art. 11. When the survey supports the psychosocial risk management required by NR-1, compliance with a legal obligation may be considered. A company that uses Cloudflare, like this demo, also has to handle the international transfer (LGPD, art. 33). The local mode avoids that transfer."
      disclaimer: "This is a portfolio project and not legal advice. A real company should confirm the legal basis with its data protection officer and legal team."
    rights:
      title: "Questions"
      text: "Submissions are anonymous, so there is no way to find yours without the tracking code. For questions about the project, use the contact at [andreiludescher.com](https://andreiludescher.com)."

