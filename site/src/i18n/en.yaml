placeholders:
  PESSOA: "person's name"
  LOCAL: "place"
  EMAIL: "email address"
  TELEFONE: "phone number"
  CPF: "CPF, Brazilian taxpayer number"
  CNPJ: "CNPJ, Brazilian company number"
  RG: "RG, Brazilian ID card"
  CEP: "CEP, Brazilian postal code"
  MATRICULA: "employee ID"
  PLACA: "license plate"
  DOCUMENTO: "other document"
  ofensivo: "swear word, in public excerpts"

home:
  hero:
    eyebrow: "Portfolio project"
    title: "Climate survey and eNPS analysis with AI, without exposing anyone"
    lead: "Voz sem nome removes names, documents and contact details from survey comments before any model reads the text. Then a language model groups the comments by theme, measures sentiment and flags cases that need HR attention, such as harassment and burnout. The demo runs on Cloudflare. The same system can also run entirely on the company's own server."
    cta_primary: "Try the demo"
    cta_secondary: "See the dashboard"
    example_title: "A comment after it goes through the system"
    example_comment: "Desde que [PESSOA] virou coordenador em [LOCAL], ele grita com a equipe na frente de todo mundo. Já pedi ajuda no RH e nada mudou."
    example_translation: "Since [PESSOA] became supervisor in [LOCAL], he yells at the team in front of everyone. I asked HR for help and nothing changed."
    example_removed: "Removed: 1 person's name and 1 place"
    example_theme_label: "Theme"
    example_theme: "Leadership"
    example_sentiment_label: "Sentiment"
    example_sentiment: "Negative"
    example_critical_label: "Critical case"
    example_critical: "Workplace bullying"

  problem:
    title: "The problem"
    lead: "In a climate survey, the score says little. The reasons are in the open comments, and someone has to read them one by one."
    items:
      - title: "Manual reading"
        text: "Reading, sorting by theme and counting comments takes HR days in every cycle. With hundreds of answers, the analysis arrives late."
      - title: "Privacy risk"
        text: "Comments mention coworkers, managers, branches and sometimes a phone number or email. Whoever reads them learns who is being discussed, and a small slice of data can reveal who answered."
      - title: "Serious signals get lost"
        text: "A report of harassment or exhaustion can sit among the other answers until the final report."
    nr1_label: "Context"
    nr1: "Since 26 May 2026, Brazil's NR-1 regulation includes psychosocial risk factors in the occupational risk management that companies must run. A climate survey does not meet that requirement on its own, but open comments often show these risks early. This is context, not legal advice."
    nr1_link: "Read NR-1 on the Ministry of Labor website (Portuguese)"
    nr1_url: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadora/normas-regulamentadoras-vigentes/nr-1"

  solution:
    title: "The solution"
    lead: "A flow that treats every comment as sensitive data, from submission to dashboard."
    items:
      - title: "Anonymization first"
        text: "Rules and a list of names from IBGE replace personal data with placeholders such as PESSOA and CPF. In local mode, a small name recognition model adds to the search. The original text is never stored."
      - title: "Two ways to run"
        text: "The demo runs on Cloudflare: Workers AI classifies with {edge_model} and receives anonymized text only. Organizations that cannot let anything leave their premises use the local mode, with {local_model} on Ollama, on their own server's CPU."
      - title: "Dashboard with a minimum group"
        text: "No group with fewer than {k} answers is shown. Small areas are merged so nobody can be identified by subtraction."
      - title: "Critical case alerts"
        text: "When the model or the risk lexicon points to harassment, discrimination, burnout or threats, the system records an alert with the anonymized text only. In local mode, n8n notifies the person in charge on Telegram and sends a daily summary. In the demo, the Worker can forward the case to an n8n webhook."

  how:
    title: "How it works"
    lead: "The live demo runs entirely on Cloudflare, with no server of its own. Every answer goes through fixed rules and a language model. The legend shows the kind of each part. Name recognition exists only in local mode, and n8n comes in after the alert."
    figure_title: "Path of one answer in the demo, from submission to dashboard and alert"
    figure_caption: "Colors and tags show the kind of each part. The local mode branch exists only when the system runs on its own server. The same information appears as text in the numbered list."
    text_title: "The diagram as text"
    legend_title: "Legend"
    kinds:
      rule: {tag: "RULE", name: "Fixed rule", text: "patterns, word lists and check digits. Always gives the same result."}
      ner: {tag: "NER", name: "Small model", text: "recognizes names of people and places with spaCy. Local mode only."}
      llm: {tag: "LLM", name: "Language model", text: "reads the anonymized text and returns labels in a fixed format. In the demo, {edge_model} on Workers AI. In local mode, {local_model} on Ollama."}
      n8n: {tag: "N8N", name: "Automation", text: "n8n workflows. In local mode they send the alerts and a daily summary and delete old submissions. In the demo, n8n only receives critical cases through a webhook, when one is set up."}
    branch_edge: "demo"
    branch_local: "local mode"
    branch_all: "all"
    branch_critical: "if critical"
    divider: "From here on, anonymized text only"
    steps:
      input:
        title: "Answer"
        lines: ["Score from 0 to 10, area, tenure", "and an optional comment"]
        text: "The answer reaches the Cloudflare Worker with a score from 0 to 10, area, tenure and an optional comment. Before that, Turnstile checks that the sender is not a bot."
      rules:
        title: "Rules in the Worker"
        lines: ["CPF, CNPJ, RG, CEP, email, phone, plate,", "employee ID, address, IBGE names"]
        text: "Inside the Worker, patterns and check digits find Brazilian documents (CPF, CNPJ, RG, CEP), email addresses, phone numbers, plates, employee IDs and addresses. Lists from IBGE, the Brazilian statistics office, find names of people and places. Each finding becomes a placeholder such as PESSOA, and the original text is dropped here."
      ner:
        title: "Names and places"
        lines: ["A small spaCy model finds what", "the rules miss"]
        text: "Local mode only. A small spaCy model finds names of people and places the rules miss. The demo has no such step, so place names slip through more easily."
      lexicon:
        title: "Risk lexicon"
        lines: ["Explicit phrases about harassment,", "violence or self-harm flag the case"]
        text: "Explicit phrases about harassment, violence or self-harm flag the case as critical, even if the model fails. The flag is dropped only when both model readings say it is not a critical case."
      llm:
        title: "Workers AI"
        lines: ["{edge_model} returns themes,", "sentiment and a first critical flag"]
        text: "The Worker sends only the anonymized text to Workers AI, where {edge_model} (`{edge_model_id}`) returns themes, sentiment and a first critical flag. In local mode, the same prompt runs on {local_model} with Ollama, on the server's CPU."
      verifier:
        title: "Second reading"
        lines: ["With any sign of risk, the model rereads.", "When in doubt, the case stays flagged."]
        text: "With any sign of risk, the model reads the comment again, focused on critical cases. When in doubt, the case stays flagged."
      storage:
        title: "D1 database"
        lines: ["Keeps only the anonymized text,", "the labels and the timings"]
        text: "The result is stored in D1, Cloudflare's database: anonymized text, labels and timings. Public submissions are deleted after {days} days. In local mode, the database is SQLite on the server itself."
      dashboard:
        title: "Dashboard"
        lines: ["Groups with {k} or", "more answers"]
        text: "The dashboard shows only groups with {k} or more answers."
      alert:
        title: "Alert"
        lines: ["Recorded, and can", "go to n8n"]
        text: "A critical case becomes an alert recorded in D1, with the anonymized text only. When an n8n webhook is set up, the Worker forwards the alert to it."
    local_title: "Local mode"
    local_items:
      - "Runs with docker compose on the organization's own server. No comment leaves its infrastructure."
      - "Anonymizes with the same rules and IBGE name list, plus spaCy name recognition."
      - "Classifies with {local_model} on Ollama, on the server's CPU, without a GPU."
      - "n8n sends the alerts on Telegram, writes a daily summary and deletes old submissions."
      - "The published analysis of the synthetic dataset and the CPU timing come from this mode."

  results:
    title: "Results"
    lead: "Numbers measured on the synthetic dataset. Anonymization is checked against personal data planted at known positions, and classification is compared with the reference named below the tiles. The tiles show the live demo, which runs on Cloudflare. The table compares the demo with the local mode."
    sample_note: "These numbers are samples. Measured results appear here after the evaluation."
    live_title: "Live demo (Cloudflare)"
    items:
      pii_recall:
        label: "Personal data found"
        method: "Share of the personal data planted in the synthetic dataset that the Worker replaced with placeholders, using only rules and the IBGE lists, without a name recognition model."
        n: "{n} personal data items"
      pii_leaks:
        label: "Comments with a leak"
        method: "Comments where at least one planted personal data item was left, among those that had any."
        n: "{n} comments"
      critical_recall:
        label: "Critical cases found"
        method: "Critical cases in the test set that the system flagged. This is the number that matters most: a missed case costs more than a false alarm."
        n: "{n} critical cases"
      critical_precision:
        label: "Correct alerts"
        method: "Among comments flagged as critical, the share that really was critical."
        n: "{n} alerts"
      sentiment:
        label: "Correct sentiment"
        method: "Test set comments where the sentiment matched the labels."
        n: "{n} comments"
        extra: "Cohen's kappa: {value}"
      themes:
        label: "Themes, macro F1"
        method: "Mean F1 over the themes. Rare themes weigh the same as common ones."
        n: "{n} comments"
      latency:
        label: "Time per comment"
        method: "Median classification time on Workers AI, measured by the Worker for each comment."
        n: "{n} comments"
        extra: "p95: {value}"
    ci: "95% CI: {lo} to {hi}"
    compare:
      title: "Demo (Cloudflare) vs local mode (own server)"
      lead: "The same synthetic comments, measured on both paths. Local mode time is measured on the server's CPU, without a GPU, after the model is loaded."
      col_metric: "Measure"
      col_edge: "Demo (Cloudflare)"
      col_local: "Local mode (own server)"
      n: "(n = {n})"
      rows:
        anonymizer: {label: "Anonymization", edge: "Rules and IBGE lists, in the Worker", local: "Rules, IBGE lists and spaCy NER"}
        model: {label: "Model", edge: "{edge_model} on Workers AI", local: "{local_model} on Ollama, on the CPU"}
    reference:
      intended: "Reference: labels set when the synthetic dataset was generated."
      human: "Reference: labels from a person who read the comments without seeing the model's answer."
      panel: "Reference: labels from another language model, from a different provider, which read the comments blind in three independent readings, by majority vote. These are not human labels."
    hardware: "Local mode server with {cpus} vCPUs and {mem} GiB of RAM."
    pipeline:
      edge: "Demo: {parts}."
      local: "Local mode: {parts}."
    pipeline_parts:
      model: "model {value}"
      prompt: "prompt {value}"
      anonymizer: "anonymizer {value}"

  estimate:
    title: "Hours saved"
    lead: "A simple calculation for your own case. Change the values in the table and the result updates right away."
    note: "The default values are example assumptions, not measurements. Machine time comes from the measurements above: the demo's when it exists, otherwise the local mode's."
    table_caption: "Assumptions of the estimate"
    col_assumption: "Assumption"
    col_value: "Value"
    rows:
      responses_per_cycle: {label: "Answers per cycle", unit: "answers"}
      comment_share: {label: "Share with a comment", unit: "%"}
      minutes_read_classify: {label: "Minutes to read and classify one comment", unit: "min"}
      minutes_anonymize: {label: "Minutes to anonymize one comment by hand", unit: "min"}
      cycles_per_year: {label: "Survey cycles per year", unit: "cycles"}
      review_share: {label: "Share that still needs human review", unit: "%"}
      minutes_per_review: {label: "Minutes per review", unit: "min"}
    outputs_title: "Result of the estimate"
    outputs:
      comments: "Comments per year"
      manual: "Hours of manual work per year"
      review: "Hours of review with the system"
      saved: "Hours saved per year"
      machine: "Machine time per year"
    machine_not_measured: "Not measured yet"
    machine_source:
      edge: "Machine time uses the mean measured on Workers AI."
      local: "Machine time uses the mean measured on the local mode's CPU."
    hours: "{value} h"
    formula_title: "How the calculation works"
    formula:
      - "Comments per year = answers × share with a comment × cycles."
      - "Manual work = comments × (reading minutes + anonymization minutes) ÷ 60."
      - "Review with the system = comments × reviewed share × minutes per review ÷ 60."
      - "Hours saved = manual work minus review. Machine time uses the measured mean per comment and does not count as people's work."
    reset: "Reset to default values"
    invalid: "Use a number between {min} and {max}."

  preview:
    title: "The dashboard"
    lead: "The dashboard shows eNPS, themes, sentiment and critical cases without exposing small groups."
    enps_label: "eNPS of the synthetic dataset"
    responses: "{n} answers"
    promoters: "Promoters"
    passives: "Passives"
    detractors: "Detractors"
    bar_label: "Distribution of answers"
    explainer: "eNPS is the percentage of promoters (scores 9 and 10) minus the percentage of detractors (0 to 6). It ranges from −100 to +100."
    empty: "The synthetic dataset does not have enough answers to show numbers yet."
    link: "See the full dashboard"

  privacy_summary:
    title: "Privacy"
    lead: "The demo was designed to keep as little as possible."
    items:
      - "The comment is anonymized inside the Cloudflare Worker, before it reaches the model. The original text is never stored."
      - "Cloudflare states that it does not use this content to train models and does not keep what goes through the model after the response."
      - "Processing and the database are outside Brazil, on Cloudflare."
      - "IP addresses are never written to the database. Only a daily code, deleted the next day, to count distinct people."
      - "Public submissions are deleted after {days} days, and groups with fewer than {k} answers are not shown on the dashboard."
    link: "Read the privacy page"

  demo:
    title: "Try it with a fictitious answer"
    text: "Write as if you worked at Talvana Distribuição, a made up company. You get a code to follow the result of the analysis."
    cta: "Submit an answer"

