privacy:
  title: "Privacy"
  toc_title: "On this page"
  lead: "This page explains what the public demo collects and how each item is handled. It is a portfolio project and uses a fictitious company."
  updated: "Applies to the current version of the demo."
  sections:
    collect:
      title: "What the demo collects"
      items:
        - "The score from 0 to 10, the area and the tenure you pick."
        - "The comment, if you write one. It is anonymized before it is stored."
        - "The page language and the date and time of the submission."
        - "The result of the bot check (Cloudflare Turnstile). The token is verified and dropped."
    anonymize:
      title: "What is anonymized and how"
      text: "Before storing anything, the system looks for personal data in the comment and replaces each item with a placeholder. Fixed rules find documents and contact details by their patterns and check digits. A list of names from IBGE, the Brazilian statistics office, and a small name recognition model find people and places. Only the text with placeholders goes on to the language model."
      table_caption: "Placeholders used instead of personal data"
      col_marker: "Placeholder"
      col_meaning: "What it replaces"
      limits: "No method is always right. That is why we ask you not to write real data. In public excerpts on the dashboard, swear words also become a placeholder."
    never:
      title: "What is never stored"
      items:
        - "The original comment text."
        - "Your IP address. It stays in memory only, to limit excessive submissions and to count distinct people per day with a code that changes every day."
        - "Tracking cookies or audience analytics. The site uses none."
    retention:
      title: "How long data is kept"
      items:
        - "Public submissions: deleted after {days} days."
        - "Alert log: only an identifier, the case types and timestamps, deleted after {alert_days} days."
        - "Daily counters without any text, such as number of submissions and analysis time: kept for the production statistics."
    min_group:
      title: "Minimum group"
      text: "No group, cross tab or slice with fewer than {k} answers is shown on the dashboard. Small areas are merged into one unnamed group. When that group is small too, the smallest visible area joins it, so nobody can find a hidden group by subtracting the others from the total."
    who:
      title: "Who sees what"
      table_caption: "Access to the demo data"
      col_who: "Who"
      col_what: "What they see"
      rows:
        - who: "Anyone on the site"
          what: "Aggregated numbers with a minimum group and anonymized excerpts of critical cases, without tenure and with the area only when the group is large enough."
        - who: "The person who submitted"
          what: "Their own result, with the tracking code."
        - who: "Person in charge of the project"
          what: "The alerts, with the anonymized text, which can go to Telegram, and the database, which keeps anonymized text only."
        - who: "Cloudflare"
          what: "Connection data to deliver the site, run the bot check and block abuse, under Cloudflare's own policy."
    legal:
      title: "Suggested legal basis for a real company"
      text: "In this demo, the basis is your consent, given with the confirmation box on the form. In a real company in Brazil, the most common basis for a climate survey is legitimate interest (LGPD, art. 7, IX), with a documented balancing test and the right not to answer. Comments may contain sensitive data, such as health or sexual orientation, which needs a basis from art. 11. When the survey supports the psychosocial risk management required by NR-1, compliance with a legal obligation may be considered."
      disclaimer: "This is a portfolio project and not legal advice. A real company should confirm the legal basis with its data protection officer and legal team."
    rights:
      title: "Questions"
      text: "Submissions are anonymous, so there is no way to find yours without the tracking code. For questions about the project, use the contact at [andreiludescher.com](https://andreiludescher.com)."

